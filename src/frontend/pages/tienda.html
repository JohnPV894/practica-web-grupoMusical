<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <link rel="icon" href="../media/logo-removebg-preview (2).png" type="image/x-icon">
  <link rel="stylesheet" href="../styles/tienda.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../styles/seccionesPrincipales.css">

</head>
<body>

  <header class="header">
    <img src="../media/logo-removebg-preview (2).png" alt="Arctic Monkeys Logo" class="logo">
    <nav class="nav">
      <a href="inicio.html" class="activo">Inicio</a>
      <a href="tienda.html">Tienda</a>
      <a href="eventos.html">Eventos</a>
      <a href="musica.html">Música</a>
    </nav>
    <div class="hamburger-menu">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </header>

  <div class="contenedor-main">
    <main class="contenido-tienda">

      <div class="barra-superior">
        <button id="boton-filtros"><i class="fas fa-sliders-h"></i> Filtros</button>
        <input type="text" placeholder="Buscar camisetas..." />
      </div>

      <div class="rejilla-camisetas">
        <img src="../media/camisa1.webp" alt="Camisa 1">
        <img src="../media/camisa2.webp" alt="Camisa 2">
        <img src="../media/camisa3.webp" alt="Camisa 3">
        <img src="../media/camisa4.webp" alt="Camisa 4">
        <img src="../media/camisa5.webp" alt="Camisa 5">
        <img src="../media/camisa6.webp" alt="Camisa 6">
      </div>
    </main>
  </div>

  <div id="modal-filtros" class="modal oculto">
    <div class="contenido-modal">
      <button id="cerrar-modal" aria-label="Cerrar modal">&times;</button>
      <h2>Filtros</h2>
      <label><input type="checkbox"> Color negro</label>
      <label><input type="checkbox"> Color blanco</label>
      <label><input type="checkbox"> Estilo oversized</label>
      <label><input type="checkbox"> Edición limitada</label>
      <button class="boton-aplicar">Aplicar</button>
    </div>
  </div>

  <footer >
    <div class="contenido_footer">
      <div>
        <a href="#">Declaración de privacidad</a> |

      </div>
